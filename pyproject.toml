[project]
name = "google-ads-mcp"
version = "0.0.1.post1+growme.4"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "google-ads>=30.1.0",
    "mcp[cli]>=1.2.0",
    "fastmcp>=4.0,<5"
]

description = "MCP Server for Google Ads (GrowME fork — adds generate_keyword_ideas and list_customer_clients)."
readme = "README.md"
authors = [
    { name = "Dean Lukies", email = "lukiesd@users.noreply.github.com" },
    { name = "GrowME Marketing Inc.", email = "ammar@growme.ca" },
]
keywords = ["Google Ads", "Google Ads API", "MCP"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python"
]

[project.optional-dependencies]
dev = [
    "black",
    "nox >=2025.5.1, <2026"
]

[project.urls]
homepage = "https://github.com/growmedevelopment/google-ads-mcp"
repository = "https://github.com/growmedevelopment/google-ads-mcp.git"
issues = "https://github.com/growmedevelopment/google-ads-mcp/issues"
upstream = "https://github.com/googleads/google-ads-mcp"

[project.scripts]
google-ads-mcp = "ads_mcp.server:run_server"
google-ads-mcp-update-gaql = "ads_mcp.update_references:update_gaql_resource_file"

[tool.pytest.ini_options]
addopts = "--ignore-glob=*/._*"
